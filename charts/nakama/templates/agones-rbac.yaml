{{- if .Values.agones.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nakama.fullname" . }}
  labels:
    {{- include "nakama.labels" . | nindent 4 }}
---
# the fleet lives in another namespace, so the Role and its binding are created there
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nakama.fullname" . }}-allocator
  namespace: {{ .Values.agones.namespace }}
  labels:
    {{- include "nakama.labels" . | nindent 4 }}
rules:
  - apiGroups: ["allocation.agones.dev"]
    resources: ["gameserverallocations"]
    verbs: ["create"]
  - apiGroups: ["agones.dev"]
    resources: ["gameservers", "fleets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nakama.fullname" . }}-allocator
  namespace: {{ .Values.agones.namespace }}
  labels:
    {{- include "nakama.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nakama.fullname" . }}-allocator
subjects:
  - kind: ServiceAccount
    name: {{ include "nakama.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
