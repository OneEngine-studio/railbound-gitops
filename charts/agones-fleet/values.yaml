# Railbound Battle Royale Agones Fleet.
#
# Every GameServer is one Unity dedicated server (one match). The Nakama RPC "railbound_allocate" allocates a Ready server
# per match; when the match ends the server calls the Agones SDK /shutdown and the fleet starts a fresh one.

fleetName: railbound-br

image:
  repository: registry.kushanherath.me/railbound-server
  # the CI bumps this tag on every server build
  tag: "sha-900186d6"
  pullPolicy: IfNotPresent

# Login for registry.kushanherath.me: secret "registry-pull" in the platform namespace (created by hand, never stored in git).
imagePullSecrets:
  - name: registry-pull

game:
  # port the Unity server listens on INSIDE the container (the Dockerfile starts it with -port 7777).
  # Agones maps a free host port from its dynamic range (7000-8000) to it.
  containerPort: 7777

fleet:
  # Used when the autoscaler is disabled. With the autoscaler on, the autoscaler owns the replica count.
  # Starts at 0 on purpose: the server image must contain AgonesServerLifecycle (it reports /ready and /health)
  # before servers are started, otherwise they are restarted in a loop. Build the image from the Unity branch first
  # (the CI bumps `image.tag`), then enable the autoscaler below.
  replicas: 0

autoscaler:
  enabled: true
  # keep this many Ready (idle) servers available for the next matches. A replacement server needs ~2 minutes to start
  # (image pull + Unity boot), so a buffer of 2 keeps players from waiting for it.
  bufferSize: 2
  minReplicas: 2
  maxReplicas: 6

health:
  # the Unity server must report /ready by then and ping /health continuously
  initialDelaySeconds: 60
  periodSeconds: 5
  failureThreshold: 6

resources:
  # Measured on the cluster: an idle Ready server uses about 1.7 GiB of memory (and, before the server caps its frame rate,
  # about 1.2 CPU cores). The old request of 768Mi let the scheduler pack far more servers onto a node than it could hold.
  requests:
    cpu: 250m
    memory: 1536Mi
  limits:
    cpu: 2000m
    memory: 2048Mi

# Game servers run on the worker nodes only (they carry the label role=game, set by the infra repo's worker bootstrap).
# The master (role=core) runs the control plane, Argo CD, CockroachDB and the monitoring; a game server there starved it
# (master at 86 % memory, API timeouts, restarts).
nodeSelector:
  role: game
tolerations: []

prepull:
  # keep the game server image on every node (see templates/image-prepull.yaml) so replacement servers start fast
  enabled: true
