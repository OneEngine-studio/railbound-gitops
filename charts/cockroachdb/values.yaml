# Default values for cockroachdb.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: cockroachdb/cockroach
  pullPolicy: IfNotPresent
  tag: "v24.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "cockroachdb"

conf:
  # Cluster name identifier
  clusterName: "railbound-db"
  # Set to true for local development / non-production clusters
  insecure: true
  # SQL client port
  sqlPort: 26257
  # Web Admin UI / HTTP status port
  httpPort: 8080
  # Max cache size (e.g. 25%)
  cache: "25%"
  # Max memory allocated to temporary SQL data (e.g. 25%)
  maxSqlMemory: "25%"
  # Additional arguments passed to cockroach start
  extraArgs: []

service:
  type: ClusterIP
  sqlPort: 26257
  httpPort: 8080

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClassName: ""

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

backup:
  # Scheduled full backup of the Nakama database to S3 (templates/backup-cronjob.yaml).
  # Turn it on AFTER the infra repo created the bucket and attached the instance profile to the nodes (backups.tf),
  # and the monitoring alerts for it (charts/monitoring-extras, backupAlerts) at the same time.
  enabled: true
  schedule: "0 */6 * * *"
  database: nakama
  bucket: railbound-backups-668602395554-ap-south-1
  prefix: cockroachdb
  region: ap-south-1
