{{- if .Values.backup.enabled }}
# Full backup of the Nakama database to S3, on a schedule.
#
# The bucket and the access are created by the infra repo (backups.tf): the nodes carry an instance profile that may read and
# write the bucket, and `AUTH=implicit` makes CockroachDB use it, so no keys are stored in the cluster or in git.
# Retention is handled by the bucket's lifecycle rule (backup_retention_days), not here.
#
# Restore (see docs/backup-and-restore.md):
#   RESTORE DATABASE nakama FROM LATEST IN 's3://<bucket>/<prefix>?AUTH=implicit&AWS_REGION=<region>';
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cockroachdb.fullname" . }}-backup
  labels:
    {{- include "cockroachdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "cockroachdb.name" . }}-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /cockroach/cockroach
                - sql
                - --insecure
                - --host={{ include "cockroachdb.fullname" . }}:{{ .Values.service.sqlPort }}
                - -e
                - >-
                  BACKUP DATABASE {{ .Values.backup.database }}
                  INTO 's3://{{ .Values.backup.bucket }}/{{ .Values.backup.prefix }}?AUTH=implicit&AWS_REGION={{ .Values.backup.region }}'
                  AS OF SYSTEM TIME '-10s'
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
{{- end }}
