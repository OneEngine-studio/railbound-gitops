apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-agones-fleet
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/OneEngine-studio/railbound-gitops.git
    targetRevision: main
    path: charts/agones-fleet
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  # the FleetAutoscaler owns the replica count: do not let self-heal fight it
  ignoreDifferences:
    - group: agones.dev
      kind: Fleet
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
